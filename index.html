<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPV Star Box</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .roulette-container { width: 100%; height: 120px; background: #222; border-top: 2px solid #444; border-bottom: 2px solid #444; position: relative; overflow: hidden; display: flex; align-items: center; }
        .pointer { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background-color: gold; transform: translateX(-50%); z-index: 10; }
        .roulette-strip { display: flex; gap: 10px; position: absolute; left: 0; transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .item { width: 100px; height: 100px; background: #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; flex-shrink: 0; }
        .btn { margin-top: 30px; padding: 15px 30px; background: #2ea6ff; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:active { background: #1c7bc4; }
    </style>
</head>
<body>
    <h2>FPV Star Box</h2>
    <div class="roulette-container">
        <div class="pointer"></div>
        <div class="roulette-strip" id="strip"></div>
    </div>
    <button class="btn" id="spinBtn" onclick="spin()">Крутить (50 ⭐)</button>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const strip = document.getElementById('strip');
        const items = ['Пропеллеры', 'Мотор 2207', 'Рама', 'Очки DJI', 'Антенна', 'Стек'];
        for (let i = 0; i < 30; i++) {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerText = items[Math.floor(Math.random() * items.length)];
            strip.appendChild(div);
        }
        let isSpinning = false;
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            const winningIndex = Math.floor(Math.random() * 20) + 5;
            const itemWidth = 110;
            const containerCenter = window.innerWidth / 2;
            const offset = (winningIndex * itemWidth) - containerCenter + 50;
            strip.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
            strip.style.transform = 	ranslateX(-px);
            setTimeout(() => {
                isSpinning = false;
                tg.sendData(JSON.stringify({ action: "spin_result", win_index: winningIndex }));
                tg.showAlert("Вы выиграли предмет! (Логика оплаты в разработке)");
                setTimeout(() => {
                    strip.style.transition = 'none';
                    strip.style.transform = 'translateX(0px)';
                }, 1000);
            }, 4000);
        }
    </script>
</body>
</html>
